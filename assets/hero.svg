<svg width="1200" height="360" viewBox="0 0 1200 360" fill="none" xmlns="http://www.w3.org/2000/svg">
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="360">
    <stop stop-color="#07111F"/>
    <stop offset=".55" stop-color="#0B1730"/>
    <stop offset="1" stop-color="#090D18"/>
  </linearGradient>
  <linearGradient id="line" x1="720" y1="60" x2="1160" y2="300">
    <stop stop-color="#55E7FF"/>
    <stop offset=".5" stop-color="#6794FF"/>
    <stop offset="1" stop-color="#956FFF"/>
  </linearGradient>
  <radialGradient id="glow">
    <stop offset="0" stop-color="#55E7FF" stop-opacity=".35"/>
    <stop offset="1" stop-color="#55E7FF" stop-opacity="0"/>
  </radialGradient>
  <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
    <path d="M32 0H0V32" fill="none" stroke="#A5B7D6" stroke-opacity=".075"/>
  </pattern>
  <filter id="blur"><feGaussianBlur stdDeviation="34"/></filter>
  <clipPath id="c"><rect width="1200" height="360" rx="28"/></clipPath>
</defs>
<g clip-path="url(#c)">
  <rect width="1200" height="360" rx="28" fill="url(#bg)"/>
  <rect width="1200" height="360" fill="url(#grid)"/>
  <circle cx="990" cy="115" r="190" fill="url(#glow)" filter="url(#blur)">
    <animate attributeName="cx" values="990;930;990" dur="8s" repeatCount="indefinite"/>
    <animate attributeName="cy" values="115;155;115" dur="8s" repeatCount="indefinite"/>
  </circle>

  <text x="70" y="82" fill="#7E97B8" font-family="Inter,Segoe UI,Arial" font-size="14" letter-spacing="4">DATA  /  SOFTWARE  /  AUTOMATION</text>
  <text x="68" y="151" fill="#F7FAFF" font-family="Inter,Segoe UI,Arial" font-size="50" font-weight="700">Eduardo Rodrigues</text>
  <text x="68" y="207" fill="#F7FAFF" font-family="Inter,Segoe UI,Arial" font-size="50" font-weight="700">Ferreira</text>
  <rect x="70" y="233" width="510" height="1.5" fill="url(#line)"/>
  <text x="70" y="273" fill="#C4D0E2" font-family="Inter,Segoe UI,Arial" font-size="18">Data Analyst · Full Stack Developer · BI · APIs · Cloud</text>
  <text x="70" y="307" fill="#7E97B8" font-family="Inter,Segoe UI,Arial" font-size="15">From raw data and business processes to reliable digital products.</text>

  <g opacity=".95">
    <path d="M760 88C831 37 890 123 958 78C1033 29 1075 127 1150 79" stroke="url(#line)" stroke-width="2"/>
    <path d="M742 178C816 127 875 220 950 168C1018 121 1087 209 1158 154" stroke="#6C95FF" stroke-opacity=".58" stroke-width="1.5"/>
    <path d="M790 274C848 231 916 304 982 254C1042 210 1101 280 1150 246" stroke="#55E7FF" stroke-opacity=".48" stroke-width="1.5"/>
    <g fill="#55E7FF"><circle cx="760" cy="88" r="4"/><circle cx="742" cy="178" r="4"/><circle cx="790" cy="274" r="4"/></g>
    <g fill="#7E9FFF"><circle cx="958" cy="78" r="4"/><circle cx="950" cy="168" r="4"/><circle cx="982" cy="254" r="4"/></g>
    <g fill="#956FFF"><circle cx="1150" cy="79" r="4"/><circle cx="1158" cy="154" r="4"/><circle cx="1150" cy="246" r="4"/></g>
    <circle r="6" fill="#FFFFFF">
      <animateMotion dur="5.5s" repeatCount="indefinite" path="M760 88C831 37 890 123 958 78C1033 29 1075 127 1150 79"/>
      <animate attributeName="opacity" values="0;1;1;0" dur="5.5s" repeatCount="indefinite"/>
    </circle>
  </g>

  <rect x="1028" y="308" width="102" height="28" rx="14" fill="#0D1830" stroke="#6F95FF" stroke-opacity=".7"/>
  <circle cx="1048" cy="322" r="4" fill="#55E7FF">
    <animate attributeName="opacity" values=".25;1;.25" dur="1.8s" repeatCount="indefinite"/>
  </circle>
  <text x="1061" y="326" fill="#D1DBEA" font-family="Inter,Segoe UI,Arial" font-size="11">AVAILABLE</text>
